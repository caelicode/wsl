# CaeliCode WSL Configuration
# Location: /etc/caelicode/config.yaml
#
# Read via `caelicode-config get <section.key>`. Every key listed here
# is honored by the shipped scripts — shell settings apply on next
# login, service settings on next boot (`wsl --shutdown`, relaunch).
# This file is never overwritten by caelicode-update.

branding:
  # MOTD banner displayed on login
  motd_enabled: true
  motd_text: "CaeliCode WSL"

proxy:
  # Detect the Windows WinHTTP proxy at boot and export
  # HTTP_PROXY/HTTPS_PROXY/NO_PROXY for all login shells
  detect_enabled: true
  # Merge Windows root CA certs into the Linux trust store
  # (corporate TLS-inspection environments)
  merge_ca_certs: true

ssh:
  # Bridge the Windows OpenSSH agent to a WSL socket
  # (requires npiperelay.exe — see docs/troubleshooting.md)
  agent_forwarding: true

dns:
  # Watch DNS health and re-point /etc/resolv.conf at the current
  # Windows DNS servers when resolution breaks (classic VPN breakage).
  # Opt-in: it rewrites a system file.
  watch_enabled: false
  # Seconds between health probes (minimum 5)
  watch_interval: 30

updates:
  # Daily background update check (systemd timer; writes the local
  # state cache that powers the login notice — no network at login)
  check_enabled: true
  # Show the "Update available" notice in the login banner
  notify_motd: true
  # Also raise a Windows toast notification (once per new release).
  # Opt-in: a distro should not pop OS notifications uninvited.
  notify_windows_toast: false
