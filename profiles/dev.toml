# CaeliCode WSL — dev profile tool pins
# Every tool is pinned to an exact version for reproducible builds.
# The `# renovate:` annotations drive automated update PRs (see
# renovate.json); CI builds validate every bump before it can merge.
[tools]
# renovate: datasource=github-tags packageName=python/cpython extractVersion=^v(?<version>.+)$
python = "3.12.9"

# Modern CLI essentials (inherited from base)
# renovate: datasource=github-releases packageName=cli/cli extractVersion=^v(?<version>.+)$
"github-cli" = "2.96.0"
# renovate: datasource=github-releases packageName=junegunn/fzf extractVersion=^v(?<version>.+)$
fzf = "0.74.1"
# renovate: datasource=github-releases packageName=BurntSushi/ripgrep
ripgrep = "15.2.0"
# renovate: datasource=github-releases packageName=sharkdp/fd extractVersion=^v(?<version>.+)$
fd = "10.4.2"
# renovate: datasource=github-releases packageName=sharkdp/bat extractVersion=^v(?<version>.+)$
bat = "0.26.1"
# renovate: datasource=github-releases packageName=eza-community/eza extractVersion=^v(?<version>.+)$
eza = "0.23.5"
# renovate: datasource=github-releases packageName=dandavison/delta
delta = "0.19.2"
# starship is installed directly via its official installer (not mise)
# renovate: datasource=github-releases packageName=direnv/direnv extractVersion=^v(?<version>.+)$
direnv = "2.37.1"
# renovate: datasource=github-releases packageName=ajeetdsouza/zoxide extractVersion=^v(?<version>.+)$
zoxide = "0.10.0"
# renovate: datasource=github-releases packageName=mikefarah/yq extractVersion=^v(?<version>.+)$
yq = "4.53.3"

# Language runtimes
# renovate: datasource=github-releases packageName=nodejs/node extractVersion=^v(?<version>.+)$
nodejs = "24.13.1"
# renovate: datasource=github-tags packageName=golang/go extractVersion=^go(?<version>.+)$
golang = "1.26.0"
# renovate: datasource=github-releases packageName=rust-lang/rust
rust = "1.93.1"
java = "temurin-21"
# renovate: datasource=github-releases packageName=oven-sh/bun extractVersion=^bun-v(?<version>.+)$
bun = "1.3.14"
# renovate: datasource=github-releases packageName=astral-sh/uv
uv = "0.11.32"

# Developer tools
# renovate: datasource=github-releases packageName=jesseduffield/lazygit extractVersion=^v(?<version>.+)$
lazygit = "0.63.1"
# renovate: datasource=github-releases packageName=koalaman/shellcheck extractVersion=^v(?<version>.+)$
shellcheck = "0.11.0"
# renovate: datasource=github-releases packageName=hadolint/hadolint extractVersion=^v(?<version>.+)$
hadolint = "2.14.0"
