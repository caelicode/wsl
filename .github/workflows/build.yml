# CaeliCode WSL — Build, Test & Release
#
# Release integrity model (promote, never rebuild):
#   1. `version` predicts the next release with a semantic-release dry
#      run, so images can be stamped with their REAL version at build
#      time.
#   2. `build` builds + tests each profile, then exports THAT tested
#      image as the release artifact — the published tar is
#      byte-identical to what CI validated (no cache-dependent rebuild).
#   3. `release` runs semantic-release: the prepare step (exec plugin)
#      assembles manifest/payload/SBOM and asserts the predicted version
#      matches BEFORE any tag exists; the GitHub release is created as a
#      DRAFT with all assets attached, then flipped to published as the
#      final step. A failure anywhere leaves either no release or an
#      invisible draft — never a public release without assets.

name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md", "LICENSE"]
  pull_request:
    branches: [main]
  # Recovery lever: dispatching the workflow runs the recover-release
  # job, which publishes any stranded draft whose assets uploaded
  # completely (the tag-exists case a plain re-run cannot recover,
  # because the dry run predicts no new version once HEAD is tagged).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Serialize main pipelines instead of cancelling them — cancelling a
  # main run mid-release is how tags end up without published assets.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Predict next version
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      # semantic-release verifies push permission even in --dry-run
      contents: write
    outputs:
      next_version: ${{ steps.dryrun.outputs.next_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install release toolchain (locked)
        run: npm ci

      - name: Dry-run semantic-release
        id: dryrun
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No '|| true' here: semantic-release exits 0 when there is
        # legitimately nothing to release, so a non-zero exit is always
        # a real error (auth, git, npm) — masking it would silently
        # drop releases while the run stays green.
        run: |
          npx semantic-release --dry-run 2>&1 | tee dryrun.log
          NEXT="$(sed -n 's/.*The next release version is \([0-9][0-9a-zA-Z.-]*\).*/\1/p' dryrun.log | tail -1)"
          echo "next_version=${NEXT}" >> "$GITHUB_OUTPUT"
          if [ -n "$NEXT" ]; then
            echo "Next release: v${NEXT}"
          else
            echo "No release will be produced by this push."
          fi

  build:
    name: Build ${{ matrix.profile }} (${{ matrix.arch }})
    needs: [version]
    # Run for PRs too (version is skipped there and its outputs are empty)
    if: ${{ !cancelled() && (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    # arm64 builds run on native arm runners (free for public repos) —
    # QEMU emulation of multi-GB toolchain builds is not viable.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    # arm64 is a PREVIEW: failures annotate the run but never block
    # amd64 releases. Drop this once the arm64 matrix has a green
    # track record.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        profile: [base, sre, dev, data]
        arch: [amd64, arm64]
        include:
          - profile: base
            target: base-image
            test_script: test-base.sh
          - profile: sre
            target: sre-image
            test_script: test-sre.sh
          - profile: dev
            target: dev-image
            test_script: test-dev.sh
          - profile: data
            target: data-image
            test_script: test-data.sh

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Resolve image version stamp
        id: stamp
        run: |
          NEXT='${{ needs.version.outputs.next_version }}'
          if [ -n "$NEXT" ]; then
            echo "version=v${NEXT}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.profile }} image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ steps.stamp.outputs.version }}
          tags: caelicode-wsl:${{ matrix.profile }}
          load: true
          cache-from: type=gha,scope=${{ matrix.profile }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.profile }}-${{ matrix.arch }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Run ${{ matrix.profile }} tests
        run: |
          docker run --rm caelicode-wsl:${{ matrix.profile }} \
            bash /opt/caelicode/test/${{ matrix.test_script }}

      - name: Run networking tests
        run: |
          docker run --rm caelicode-wsl:${{ matrix.profile }} \
            bash /opt/caelicode/test/test-networking.sh

      - name: Run user creation tests
        run: |
          docker run --rm caelicode-wsl:${{ matrix.profile }} \
            bash /opt/caelicode/test/test-user-creation.sh

      - name: Scan image for HIGH/CRITICAL CVEs (informational)
        # Non-blocking for now: surfaces findings in the log without
        # failing the build. Tighten to --exit-code 1 once the baseline
        # is triaged. amd64 only — the arch-independent findings are
        # the same and arm64 runners shouldn't pay for a second scan.
        if: matrix.arch == 'amd64'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --exit-code 0 --timeout 20m \
            --scanners vuln caelicode-wsl:${{ matrix.profile }} \
            || echo "::warning::trivy scan did not complete for ${{ matrix.profile }}"

      - name: Check image size
        run: |
          SIZE=$(docker image inspect caelicode-wsl:${{ matrix.profile }} --format '{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"

          # Fail if image exceeds size limits (MB)
          # base: ~1100MB (Python + modern CLI tools + zsh/oh-my-zsh)
          # sre:  ~3500MB (base + k8s + IaC + AWS/Azure/GCloud CLIs)
          # dev:  ~4500MB (base + Node/Go/Rust/Java/Bun + dev tools)
          # data: ~1800MB (base + dbt + jupyter + duckdb + DB clients)
          case "${{ matrix.profile }}" in
            base) MAX=1500 ;;
            sre)  MAX=5000 ;;
            dev)  MAX=5000 ;;
            data) MAX=2000 ;;
          esac

          if [ "$SIZE_MB" -gt "$MAX" ]; then
            echo "::error::Image size (${SIZE_MB}MB) exceeds limit (${MAX}MB)"
            exit 1
          fi

      - name: Capture resolved tool versions (SBOM input)
        if: needs.version.outputs.next_version != '' && matrix.arch == 'amd64'
        run: |
          mkdir -p toolinfo
          docker run --rm caelicode-wsl:${{ matrix.profile }} \
            bash -c 'mise ls --current --json 2>/dev/null || echo "{}"' \
            > toolinfo/mise-${{ matrix.profile }}.json
          docker run --rm caelicode-wsl:${{ matrix.profile }} \
            bash -c 'dpkg-query -W -f "\${Package}\t\${Version}\n"' \
            > toolinfo/dpkg-${{ matrix.profile }}.tsv

      - name: Export tested image for release promotion
        if: needs.version.outputs.next_version != ''
        run: |
          # amd64 keeps the historical unsuffixed asset names; arm64
          # assets carry a -arm64 suffix (preview).
          SUFFIX=''
          [ "${{ matrix.arch }}" = "arm64" ] && SUFFIX='-arm64'
          NAME="caelicode-wsl-${{ matrix.profile }}${SUFFIX}"
          mkdir -p dist
          CONTAINER=$(docker create caelicode-wsl:${{ matrix.profile }})
          docker export "$CONTAINER" | gzip > "dist/${NAME}.tar.gz"
          docker rm -f "$CONTAINER" >/dev/null
          cd dist
          sha256sum "${NAME}.tar.gz" > "${NAME}.sha256"

      - name: Upload release artifact
        if: needs.version.outputs.next_version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.profile }}-${{ matrix.arch }}
          path: dist/
          retention-days: 3

      - name: Upload tool info
        if: needs.version.outputs.next_version != '' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: toolinfo-${{ matrix.profile }}
          path: toolinfo/
          retention-days: 3

  lint:
    name: Lint scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: ShellCheck scripts
        # caelicode-motd.sh is a sourced fragment (no shebang) — it
        # carries an inline 'shellcheck shell=bash' directive so the
        # glob below lints it correctly.
        run: |
          shellcheck -x \
            scripts/*.sh \
            scripts/caelicode-update scripts/caelicode-theme \
            scripts/caelicode-config scripts/caelicode-runtime-init \
            scripts/code \
            .github/scripts/*.sh \
            build.sh test/*.sh

      - name: Validate Dockerfile
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  release:
    name: Release
    needs: [version, build, lint]
    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.version.outputs.next_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Download tested image artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Download tool info
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist/toolinfo
          pattern: toolinfo-*
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install release toolchain (locked)
        run: npm ci

      - name: Run semantic-release (draft release + assets)
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PREDICTED_VERSION: v${{ needs.version.outputs.next_version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npx semantic-release

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ ! -f dist/RELEASE_VERSION ]; then
            echo "::error::semantic-release completed without preparing assets (dist/RELEASE_VERSION missing)"
            exit 1
          fi
          VER="v$(cat dist/RELEASE_VERSION)"
          ID="$(gh api "repos/${{ github.repository }}/releases" \
                --jq ".[] | select(.tag_name==\"${VER}\") | .id" | head -1)"
          if [ -z "$ID" ]; then
            echo "::error::No release found for tag ${VER}"
            exit 1
          fi
          gh api -X PATCH "repos/${{ github.repository }}/releases/${ID}" \
            -F draft=false >/dev/null
          echo "Release ${VER} published with all assets attached."

  # Publishes stranded drafts: a run that died between semantic-release
  # (tag + draft + assets) and the flip above leaves an invisible draft
  # that re-running the pipeline cannot fix (no new version to release).
  # Trigger manually via: gh workflow run build.yml
  recover-release:
    name: Publish stranded draft releases
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Flip complete drafts to published
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Completeness is checked BY NAME, not by count: a runner
          # killed mid-upload leaves a draft holding all the small
          # assets (sha256s, manifest, payload…) but none of the image
          # tars — a raw asset count would happily publish that.
          REQUIRED="caelicode-wsl-base.tar.gz caelicode-wsl-sre.tar.gz caelicode-wsl-dev.tar.gz caelicode-wsl-data.tar.gz caelicode-manifest.json caelicode-update-payload.tar.gz checksums.txt sbom.json"
          gh api "repos/${{ github.repository }}/releases?per_page=15" \
            --jq '.[] | select(.draft == true) | [.id, .tag_name, ([.assets[].name] | join(","))] | @tsv' \
          | while IFS=$'\t' read -r id tag names; do
              missing=""
              for want in $REQUIRED; do
                case ",${names}," in
                  *",${want},"*) ;;
                  *) missing="${missing} ${want}" ;;
                esac
              done
              if [ -z "$missing" ]; then
                echo "Publishing stranded draft ${tag} (all required assets present)"
                gh api -X PATCH "repos/${{ github.repository }}/releases/${id}" \
                  -F draft=false >/dev/null
              else
                echo "::warning::Draft ${tag} is incomplete — missing:${missing}. Complete it from the run's retained artifacts (gh run download + gh release upload), or delete the draft AND its tag, then push a release commit."
              fi
            done
